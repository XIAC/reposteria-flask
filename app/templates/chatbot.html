<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background:#fff5f7;
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .chat-container{
            width:400px;
            background:white;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            padding:20px;
        }

        .chat-container h2{
            text-align:center;
            color:#d63384;
            margin-bottom:15px;
        }

        #chat{
            height:300px;
            overflow-y:auto;
            border:1px solid #f3c2d3;
            border-radius:10px;
            padding:10px;
            background:#fff0f5;
            margin-bottom:10px;
        }

        .mensaje-usuario{
            background:#ffc0cb;
            padding:8px 12px;
            border-radius:10px;
            margin:5px 0;
            text-align:right;
        }

        .mensaje-bot{
            background:#f8d7da;
            padding:8px 12px;
            border-radius:10px;
            margin:5px 0;
            text-align:left;
        }

        /* input */
        .chat-input{
            display:flex;
            gap:10px;
        }

        #mensaje{
            flex:1;
            padding:10px;
            border-radius:8px;
            border:1px solid #f3c2d3;
        }

        /* boton */
        button{
            background:#d63384;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#c2186a;
        }
    </style>
</head>
<body>
    <div class="chat-container">
    <h2>🍰 Chatbot Repostería</h2>

    <div id="chat"></div>

    <div class="chat-input">
        <input type="text" id="mensaje" placeholder="Escribe tu pregunta..." />
        <button onclick="enviarMensaje()">Enviar</button>
    </div>
</div>
</body>
</html>

<script>
    function enviarMensaje(){
        let mensaje = document.getElementById("mensaje").value
        console.log(mensaje);
        fetch("/chatbot", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                mensaje: mensaje
            })
        })
        .then(response => response.json())
        .then(data => {
             let chat = document.getElementById("chat")
             chat.innerHTML += `<div class="mensaje-usuario">${mensaje}</div>`
             chat.innerHTML += `<div class="mensaje-bot">${data.respuesta}</div>`
        });
    }
</script>
